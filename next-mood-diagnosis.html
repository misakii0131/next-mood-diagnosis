<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今の気分診断｜次、なにする？を見つけよう</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
    :root{--ink:#112a58;--night:#062659;--night2:#0d3b78;--cream:#fff8ec;--gold:#ffce62;--pink:#dfa0a7;--shadow:#071a40}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--cream);font-family:"Zen Maru Gothic",sans-serif;background:radial-gradient(ellipse at 50% 22%,#1b5aa0 0,#092b65 43%,#051838 100%)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.88;background-image:radial-gradient(circle,#fff7b9 1px,transparent 1.7px),radial-gradient(circle,#fff 1.2px,transparent 1.8px),radial-gradient(circle,#ffce62 1px,transparent 2px);background-size:82px 94px,139px 117px,211px 173px;background-position:15px 21px,61px 38px,23px 99px}
    main{position:relative;width:min(720px,calc(100% - 30px));margin:auto;padding:44px 0 38px}.card{overflow:hidden;border:1px solid rgba(255,244,190,.58);border-radius:30px;background:linear-gradient(150deg,rgba(255,255,255,.15),rgba(255,255,255,.05));box-shadow:0 24px 65px rgba(0,8,32,.55),inset 0 1px rgba(255,255,255,.4);backdrop-filter:blur(7px)}
    .hero,.quiz,.result{padding:48px 29px;text-align:center}.eyebrow{margin:0 0 12px;color:#ffe092;font-size:13px;letter-spacing:.15em}.spark{margin:0 0 3px;font-size:35px;color:var(--gold);text-shadow:0 0 12px #ffdc85}.hero h1,.result h2{margin:0;font-family:"Kaisei Decol",serif;font-weight:500;line-height:1.43;text-shadow:0 0 16px rgba(255,239,170,.45)}.hero h1{font-size:clamp(34px,8vw,54px)}.hero h1 small{display:block;font-size:.55em;margin-top:6px}.lead{max-width:440px;margin:23px auto 28px;font-size:14px;line-height:2;color:#fff9ed}.motifs{font-size:37px;letter-spacing:7px;margin:10px 0 29px;filter:drop-shadow(0 6px 7px rgba(0,0,0,.3))}
    button{border:0;font:inherit;cursor:pointer}.start,.save{padding:15px 30px;border-radius:999px;color:#523355;background:linear-gradient(135deg,#fff5d9,#f8c36f);font-weight:700;box-shadow:0 6px 0 #a96870,0 11px 25px rgba(0,0,0,.25);transition:.18s}.start:hover,.save:hover{transform:translateY(-2px)}
    .quiz,.result{display:none}.progress{display:flex;align-items:center;gap:12px;margin-bottom:22px;color:#ffe6ab;font-size:12px}.bar{height:7px;flex:1;overflow:hidden;background:rgba(255,255,255,.18);border-radius:99px}.bar i{display:block;width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd168,#ffc5d1);transition:width .3s}.question-number{margin:0;color:#ffc969;font-size:12px;letter-spacing:.14em}.question{margin:8px 0 0;min-height:3.3em;font-family:"Kaisei Decol",serif;font-weight:500;font-size:clamp(23px,5.5vw,31px);line-height:1.53}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:29px}.choice{display:flex;min-height:190px;padding:18px 14px;align-items:center;justify-content:center;flex-direction:column;border:2px solid transparent;border-radius:19px;background:linear-gradient(145deg,rgba(255,253,244,.98),rgba(255,237,219,.98));color:#193766;box-shadow:0 5px 0 rgba(0,25,75,.45);transition:.16s}.choice:hover{transform:translateY(-2px);border-color:#ffc96c;background:#fffefb}.choice:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,25,75,.45)}.scene-icon{font-size:38px;line-height:1.1}.scene-title{margin-top:10px;font-size:15px;font-weight:700;line-height:1.5}.scene-body{margin-top:7px;color:#587090;font-size:11px;font-weight:500;line-height:1.65}
    .result{padding:28px 20px 35px}.result-card{position:relative;overflow:hidden;max-width:540px;margin:auto;padding:35px 24px 26px;border:1px solid rgba(255,237,171,.65);border-radius:25px;background:radial-gradient(circle at 50% 0,#3c78b8,#163c76 45%,#082354);box-shadow:0 15px 34px rgba(0,4,28,.32)}.result-card:before{content:"✦  ·  ✧  ·  ✦  ·  ✧  ·  ✦";position:absolute;top:13px;left:0;width:100%;color:#ffdc7c;font-size:12px;letter-spacing:5px}.result-label{margin:2px 0 4px;color:#ffe4a4;font-size:11px;letter-spacing:.15em}.result-icon{margin:9px 0 3px;font-size:70px}.result h2{font-size:clamp(28px,7vw,41px)}.result-sub{margin:4px 0 0;color:rgba(255,228,164,.9);font-size:11px;letter-spacing:.05em}.result-lead{max-width:430px;margin:16px auto 6px;font-size:13px;line-height:1.95}.result-art{display:block;width:auto;height:250px;max-width:78%;margin:0 auto 2px;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,12,46,.28))}.scroll-cue{margin:2px 0 12px;color:rgba(255,235,183,.88);font-size:11px;animation:float 1.7s ease-in-out infinite}.next{padding:18px 18px 15px;border-radius:19px;background:linear-gradient(135deg,#fff9e8,#ffe7d8);color:#244064;text-align:left;box-shadow:inset 0 0 0 1px white}.next h3{margin:0 0 8px;color:#b76e7e;font-size:15px}.next p{margin:0;font-size:13px;line-height:1.85}.next strong{color:#a85d71}.example-label{margin-top:12px!important;color:#b76e7e;font-size:11px!important;font-weight:700}.next-examples{display:grid;gap:6px;margin:6px 0 0;padding:0;list-style:none}.next-examples li{padding:7px 9px;border-radius:9px;background:rgba(255,255,255,.64);font-size:12px;line-height:1.45}.next-examples li:before{content:"✦";margin-right:7px;color:#d69a44}.more-examples{display:block;margin:10px auto 0;padding:4px 8px;color:#8d6575;background:transparent;font-size:11px;text-decoration:underline;text-underline-offset:3px}.again{margin-top:17px;padding:8px;color:#fff0c7;background:transparent;text-decoration:underline;text-underline-offset:4px}.result-actions{margin-top:21px}.save-note{margin:14px 0 0;color:rgba(255,244,219,.76);font-size:11px;line-height:1.6}footer{padding:20px 0 0;text-align:center;color:rgba(255,242,206,.7);font-size:11px;letter-spacing:.08em}@keyframes float{50%{transform:translateY(3px)}}
    @media(max-width:480px){main{width:min(100% - 18px,720px);padding-top:20px}.hero{padding:43px 19px 37px}.quiz{padding:33px 15px}.result{padding-left:13px;padding-right:13px}.result-card{padding-left:17px;padding-right:17px}.choices{gap:10px}.choice{min-height:174px;padding:14px 10px}.scene-icon{font-size:34px}.scene-title{font-size:14px}.scene-body{font-size:10px}.result-art{height:218px}.result-lead{font-size:12px}.next{padding:15px}.next-examples li{font-size:11px}}
  </style>
</head>
<body>
  <main>
    <section class="card" aria-live="polite">
      <section class="hero" id="hero">
        <p class="spark" aria-hidden="true">✦</p><p class="eyebrow">NEXT, WHAT DO YOU FEEL LIKE?</p>
        <h1>今の気分診断<small>「次、なにする？」を見つけよう</small></h1>
        <p class="lead">やりたいことを4つに分けたら、<br>今の気分にぴったりな一歩を見つけよう。</p>
        <div class="motifs" aria-hidden="true">🌱 🍰 🌙 📓</div><button class="start" type="button">診断をはじめる ✦</button>
      </section>
      <section class="quiz" id="quiz">
        <div class="progress"><span id="step">QUESTION 1</span><div class="bar"><i id="bar"></i></div><span>6問</span></div>
        <p class="question-number" id="number">QUESTION 01</p><h2 class="question" id="question"></h2><div class="choices" id="choices"></div>
      </section>
      <section class="result" id="result">
        <div class="result-card" id="resultCard"><p class="result-label">YOUR MOOD RIGHT NOW IS...</p><div class="result-icon" id="resultIcon"></div><h2 id="resultTitle"></h2><p class="result-sub" id="resultSub"></p><p class="result-lead" id="resultLead"></p><img class="result-art" id="resultArt" alt="診断結果のイラスト"><p class="scroll-cue">↓ 次にやることのヒントを見る</p><div class="next" id="next"></div><button class="again" type="button">もう一度診断する</button></div>
        <div class="result-actions"><button class="save" type="button">結果画像を保存する ↓</button><p class="save-note">保存した画像を、今夜の「次、なにする？」メモに。</p></div>
      </section>
    </section><footer>やりたいことを、今の自分に合う一歩へ。</footer>
  </main>
  <script>
    const questions=[
      ['用事の帰り道、少しだけ寄り道するなら？',[['📚','気になる本屋さん','まだ知らない世界を、少しのぞいてみる','grow'],['☕','気になっていたカフェ','季節のドリンクを、ゆっくり味わう','enjoy']]],
      ['秋の夜、家に帰って最初に灯したいのは？',[['🕯️','やわらかな間接照明','部屋の空気を、ゆっくり落ち着かせる','heal'],['💡','机を照らす小さなデスクライト','手元のことを、ひとつずつ片づける','organize']]],
      ['秋の夜カフェで、自然と選ぶ席は？',[['🪟','窓際のひとり席','外を眺めながら、新しいページを開く','grow'],['🫖','ソファの奥の席','少しだけ世界の音を小さくする','heal']]],
      ['帰り道に、ふと足を止めるなら？',[['🎪','イベントのポスターが並ぶ掲示板','気になる予定を、ひとつ見つけたい','enjoy'],['✏️','文房具屋さんのきれいな棚','手元を気持ちよく整えたくなる','organize']]],
      ['今夜、机の上にひとつだけ置くなら？',[['🗝️','まだ使ったことのない鍵','新しいことの入り口を、のぞいてみる','grow'],['📓','まっさらなノートと細いペン','散らばったことに、名前をつける','organize']]],
      ['明日の朝、部屋に残っていてほしい空気は？',[['🎟️','わくわくするチケット','今日より少し楽しい予定をつくりたい','enjoy'],['☁️','やわらかな朝もや','急がず始められる、やさしい静けさ','heal']]]
    ];
    const results={
      grow:{icon:'🌱',title:'育てる気分',sub:'気分に寄り添うお供スイーツ：じっくりアップルパイ',image:'mood-grow-sprout-transparent.png',lead:'今のあなたは、未来の自分に小さな水やりをしたいとき。完璧じゃなくて大丈夫。続けたいことに、少しだけ触れてみよう。',next:'やりたいことリストの <strong>「育てる」</strong> から、<strong>10〜30分で始められること</strong>をひとつ選んでみて。',examples:['Photoshopを触る','気になるコースを1レッスン進める','課題や制作を30分進める','コンペ・お仕事応募に挑戦する','ポートフォリオを1か所更新する','気になる職種・案件を調べる','勉強会・もくもく会に参加する','新しいツールをひとつ触ってみる']},
      enjoy:{icon:'🍰',title:'楽しむ気分',sub:'気分に寄り添うお供スイーツ：ときめきマロンパフェ',image:'mood-enjoy-marron-parfait-v2.png',lead:'今のあなたは、ときめきに素直になりたいとき。推し活・趣味・おでかけ・気になる体験など、心が弾むことを選んで大丈夫。',next:'やりたいことリストの <strong>「楽しむ」</strong> から、今いちばん<strong>「やりたい！」</strong>と思うことをひとつ選んでみて。',examples:['旅行の計画を立てる','気になるコミュニティイベントに参加する','Xで好きなことをきっかけに交流する','推し活の予定を立てる','気になるカフェを調べる','友達と会う予定を立てる','ひとりお出かけ先を決める','創作したいことのアイデアを集める']},
      heal:{icon:'🌙',title:'癒す気分',sub:'気分に寄り添うお供スイーツ：とろけるかぼちゃプリン',image:'mood-heal-moon-window-transparent.png',lead:'今のあなたは、がんばった自分をやさしく回復させたいとき。まずは余白をつくることが、次の一歩のエネルギーになります。',next:'やりたいことリストの <strong>「癒す」</strong> から、今の自分が<strong>いちばんほっとできそうなこと</strong>をひとつ選んでみて。',examples:['デジタルデトックスをする','ゆっくりお風呂に入る','早めに寝る準備をする','夜に少し散歩する','好きな香りで休む','何もしない時間をつくる','あたたかい飲み物をゆっくり飲む','自分をねぎらうメモを書く']},
      organize:{icon:'📓',title:'整える気分',sub:'気分に寄り添うお供スイーツ：すっきり洋梨タルト',image:'mood-organize-notebook-transparent.png',lead:'今のあなたは、気持ちや暮らしに見通しをつくりたいとき。小さく整えるだけでも、次の一歩がぐっと見えやすくなります。',next:'やりたいことリストの <strong>「整える」</strong> から、終えたあとに<strong>すっきりしそうなこと</strong>をひとつ選んでみて。',examples:['ビジョンマップを見直す','デスクまわりを10分片付ける','やりたいことを3つにしぼる','今週の予定を見直す','後回しのタスクを1つ整理する','SHElikesのプロフィールを見直す','応募・受講の予定を決める','やりたいことリストをカテゴリ分けする']}
    };
    let index=0,scores={grow:0,enjoy:0,heal:0,organize:0},current,shownExamples=[];const $=id=>document.getElementById(id);
    function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
    function showQuestion(){const q=questions[index];$('step').textContent=`QUESTION ${index+1}`;$('number').textContent=`QUESTION ${String(index+1).padStart(2,'0')}`;$('bar').style.width=`${index/questions.length*100}%`;$('question').textContent=q[0];$('choices').innerHTML='';shuffle(q[1]).forEach(([icon,title,body,type])=>{const b=document.createElement('button');b.className='choice';b.type='button';b.innerHTML=`<span class="scene-icon">${icon}</span><span class="scene-title">${title}</span><span class="scene-body">${body}</span>`;b.onclick=()=>answer(type);$('choices').append(b)})}
    function answer(type){scores[type]++;index++;index<questions.length?showQuestion():showResult()}
    function renderNext(){shownExamples=shuffle(current.examples).slice(0,3);$('next').innerHTML=`<h3>次にやることを見つけよう</h3><p>${current.next}</p><p class="example-label">たとえば</p><ul class="next-examples">${shownExamples.map(item=>`<li>${item}</li>`).join('')}</ul><button class="more-examples" type="button">別の例を見る ↻</button>`;document.querySelector('.more-examples').onclick=renderNext}
    function showResult(){const winner=Object.keys(scores).reduce((a,b)=>scores[b]>scores[a]?b:a,'grow');current=results[winner];$('quiz').style.display='none';$('resultIcon').textContent=current.icon;$('resultTitle').textContent=current.title;$('resultSub').textContent=current.sub;$('resultLead').textContent=current.lead;$('resultArt').src=current.image;renderNext();$('result').style.display='block'}
    function wrap(ctx,text,x,y,width,lineHeight){let line='',rows=[];for(const c of text){if(ctx.measureText(line+c).width>width){rows.push(line);line=c}else line+=c}rows.push(line);rows.forEach((v,i)=>ctx.fillText(v,x,y+i*lineHeight))}
    function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
    async function image(){const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=1080;c.height=1870;const bg=ctx.createRadialGradient(540,40,30,540,30,1350);bg.addColorStop(0,'#367fc3');bg.addColorStop(.48,'#153e7b');bg.addColorStop(1,'#061b43');ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#ffdd7b';ctx.font='30px sans-serif';ctx.textAlign='center';ctx.fillText('✦  ·  ✧  ·  ✦  ·  ✧  ·  ✦',540,80);ctx.font='22px sans-serif';ctx.fillText('NEXT, WHAT DO YOU FEEL LIKE?',540,145);ctx.font='112px sans-serif';ctx.fillText(current.icon,540,285);ctx.fillStyle='#fff8ed';ctx.font='52px serif';ctx.fillText(current.title,540,380);ctx.fillStyle='#ffe4a4';ctx.font='24px sans-serif';ctx.fillText(current.sub,540,430);ctx.fillStyle='#fff8ed';ctx.font='28px sans-serif';wrap(ctx,current.lead,540,505,820,45);const art=$('resultArt');if(!art.complete||!art.naturalWidth)throw new Error('イラストの読み込み待ちです');const artHeight=360,artWidth=art.naturalWidth/art.naturalHeight*artHeight;ctx.drawImage(art,(1080-artWidth)/2,565,artWidth,artHeight);ctx.fillStyle='#fff6e6';round(ctx,90,965,900,590,30);ctx.fill();ctx.textAlign='left';ctx.fillStyle='#b76e7e';ctx.font='bold 30px sans-serif';ctx.fillText('次にやることを見つけよう',145,1040);ctx.fillStyle='#244064';ctx.font='27px sans-serif';wrap(ctx,current.next.replace(/<[^>]+>/g,''),145,1105,770,48);ctx.fillStyle='#b76e7e';ctx.font='bold 23px sans-serif';ctx.fillText('たとえば',145,1245);ctx.fillStyle='#244064';ctx.font='24px sans-serif';shownExamples.forEach((item,i)=>ctx.fillText(`✦ ${item}`,155,1310+i*70));ctx.textAlign='center';ctx.fillStyle='#ffe59b';ctx.font='25px sans-serif';ctx.fillText('やりたいことを、今の自分に合う一歩へ。',540,1750);return new Promise((resolve,reject)=>c.toBlob(blob=>blob?resolve(blob):reject(new Error('画像の作成に失敗しました')),'image/png'))}
    document.querySelector('.start').onclick=()=>{$('hero').style.display='none';$('quiz').style.display='block';showQuestion()};document.querySelector('.again').onclick=()=>{index=0;scores={grow:0,enjoy:0,heal:0,organize:0};$('result').style.display='none';$('hero').style.display='block'};document.querySelector('.save').onclick=async()=>{const button=document.querySelector('.save'),original=button.textContent;button.disabled=true;button.textContent='画像を作成中…';try{const blob=await image(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='今の気分診断.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);button.textContent='保存をはじめました ✦'}catch(error){button.textContent='もう一度保存する ↓';alert('保存できませんでした。少し待ってから、もう一度お試しください。')}finally{setTimeout(()=>{button.disabled=false;button.textContent=original},1800)}};
  </script>
</body>
</html>
