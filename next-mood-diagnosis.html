<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>今の気分診断｜次、なにする？を見つけよう</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
    :root{--ink:#112a58;--night:#062659;--night2:#0d3b78;--cream:#fff8ec;--gold:#ffce62;--pink:#dfa0a7;--shadow:#071a40}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--cream);font-family:"Zen Maru Gothic",sans-serif;background:radial-gradient(ellipse at 50% 22%,#1b5aa0 0,#092b65 43%,#051838 100%)}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.88;background-image:radial-gradient(circle,#fff7b9 1px,transparent 1.7px),radial-gradient(circle,#fff 1.2px,transparent 1.8px),radial-gradient(circle,#ffce62 1px,transparent 2px);background-size:82px 94px,139px 117px,211px 173px;background-position:15px 21px,61px 38px,23px 99px}
    main{position:relative;width:min(720px,calc(100% - 30px));margin:auto;padding:44px 0 38px}.card{overflow:hidden;border:1px solid rgba(255,244,190,.58);border-radius:30px;background:linear-gradient(150deg,rgba(255,255,255,.15),rgba(255,255,255,.05));box-shadow:0 24px 65px rgba(0,8,32,.55),inset 0 1px rgba(255,255,255,.4);backdrop-filter:blur(7px)}
    .hero,.quiz,.result{padding:48px 29px;text-align:center}.ribbon{position:absolute;right:-41px;top:24px;transform:rotate(43deg);width:210px;padding:8px 0;background:#d99fa5;color:#fffaf5;font-size:10px;letter-spacing:.12em;z-index:2}.eyebrow{margin:0 0 12px;color:#ffe092;font-size:13px;letter-spacing:.15em}.spark{margin:0 0 3px;font-size:35px;color:var(--gold);text-shadow:0 0 12px #ffdc85}.hero h1,.result h2{margin:0;font-family:"Kaisei Decol",serif;font-weight:500;line-height:1.43;text-shadow:0 0 16px rgba(255,239,170,.45)}.hero h1{font-size:clamp(34px,8vw,54px)}.hero h1 small{display:block;font-size:.55em;margin-top:6px}.lead{max-width:440px;margin:23px auto 28px;font-size:14px;line-height:2;color:#fff9ed}.motifs{font-size:37px;letter-spacing:7px;margin:10px 0 29px;filter:drop-shadow(0 6px 7px rgba(0,0,0,.3))}
    button{border:0;font:inherit;cursor:pointer}.start,.save{padding:15px 30px;border-radius:999px;color:#523355;background:linear-gradient(135deg,#fff5d9,#f8c36f);font-weight:700;box-shadow:0 6px 0 #a96870,0 11px 25px rgba(0,0,0,.25);transition:.18s}.start:hover,.save:hover{transform:translateY(-2px)}
    .quiz,.result{display:none}.progress{display:flex;align-items:center;gap:12px;margin-bottom:22px;color:#ffe6ab;font-size:12px}.bar{height:7px;flex:1;overflow:hidden;background:rgba(255,255,255,.18);border-radius:99px}.bar i{display:block;width:0;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd168,#ffc5d1);transition:width .3s}.question-number{margin:0;color:#ffc969;font-size:12px;letter-spacing:.14em}.question{margin:8px 0 0;min-height:3.3em;font-family:"Kaisei Decol",serif;font-weight:500;font-size:clamp(23px,5.5vw,31px);line-height:1.53}.choices{display:grid;gap:12px;margin-top:29px}.choice{width:100%;padding:16px 17px;text-align:left;border:2px solid transparent;border-radius:16px;background:rgba(255,250,239,.97);color:#193766;font-weight:700;line-height:1.55;box-shadow:0 5px 0 rgba(0,25,75,.45);transition:.16s}.choice:hover{transform:translateY(-2px);border-color:#ffc96c;background:#fffefb}.choice:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,25,75,.45)}
    .result{padding:28px 20px 35px}.result-card{position:relative;overflow:hidden;max-width:540px;margin:auto;padding:35px 24px 26px;border:1px solid rgba(255,237,171,.65);border-radius:25px;background:radial-gradient(circle at 50% 0,#3c78b8,#163c76 45%,#082354);box-shadow:0 15px 34px rgba(0,4,28,.32)}.result-card:before{content:"✦  ·  ✧  ·  ✦  ·  ✧  ·  ✦";position:absolute;top:13px;left:0;width:100%;color:#ffdc7c;font-size:12px;letter-spacing:5px}.result-label{margin:2px 0 4px;color:#ffe4a4;font-size:11px;letter-spacing:.15em}.result-icon{margin:9px 0 3px;font-size:70px}.result h2{font-size:clamp(28px,7vw,41px)}.result-lead{max-width:430px;margin:16px auto 20px;font-size:13px;line-height:1.95}.next{padding:18px 18px 16px;border-radius:19px;background:linear-gradient(135deg,#fff9e8,#ffe7d8);color:#244064;text-align:left;box-shadow:inset 0 0 0 1px white}.next h3{margin:0 0 8px;color:#b76e7e;font-size:15px}.next p{margin:0;font-size:13px;line-height:1.85}.next strong{color:#a85d71}.again{margin-top:17px;padding:8px;color:#fff0c7;background:transparent;text-decoration:underline;text-underline-offset:4px}.result-actions{margin-top:21px}.save-note{margin:14px 0 0;color:rgba(255,244,219,.76);font-size:11px;line-height:1.6}footer{padding:20px 0 0;text-align:center;color:rgba(255,242,206,.7);font-size:11px;letter-spacing:.08em}
    @media(max-width:480px){main{width:min(100% - 18px,720px);padding-top:20px}.hero{padding:43px 19px 37px}.quiz{padding:33px 19px}.result{padding-left:13px;padding-right:13px}.result-card{padding-left:17px;padding-right:17px}}
  </style>
</head>
<body>
  <main>
    <section class="card" aria-live="polite">
      <div class="ribbon">SHE likes COMMUNITY EVENT</div>
      <section class="hero" id="hero">
        <p class="spark" aria-hidden="true">✦</p><p class="eyebrow">NEXT, WHAT DO YOU FEEL LIKE?</p>
        <h1>今の気分診断<small>「次、なにする？」を見つけよう</small></h1>
        <p class="lead">やりたいことを4つに分けたら、<br>今の気分にぴったりな一歩を見つけよう。</p>
        <div class="motifs" aria-hidden="true">🌱 🍰 🌙 📓</div><button class="start" type="button">診断をはじめる ✦</button>
      </section>
      <section class="quiz" id="quiz">
        <div class="progress"><span id="step">QUESTION 1</span><div class="bar"><i id="bar"></i></div><span>4問</span></div>
        <p class="question-number" id="number">QUESTION 01</p><h2 class="question" id="question"></h2><div class="choices" id="choices"></div>
      </section>
      <section class="result" id="result">
        <div class="result-card" id="resultCard"><p class="result-label">YOUR MOOD RIGHT NOW IS...</p><div class="result-icon" id="resultIcon"></div><h2 id="resultTitle"></h2><p class="result-lead" id="resultLead"></p><div class="next" id="next"></div><button class="again" type="button">もう一度診断する</button></div>
        <div class="result-actions"><button class="save" type="button">結果画像を保存する ↓</button><p class="save-note">保存した画像を、今夜の「次、なにする？」メモに。</p></div>
      </section>
    </section><footer>やりたいことを、今の自分に合う一歩へ。</footer>
  </main>
  <script>
    const questions=[
      ['今、少し時間ができたら、どんなことに心が向く？',[['未来につながる小さな勉強・挑戦をしたい','grow'],['推し活や趣味など、心が弾むことをしたい','enjoy'],['好きな飲み物やお風呂で、ゆっくり休みたい','heal'],['部屋・予定・タスクを、すっきりさせたい','organize']]],
      ['今日の自分に、いちばん必要そうなのは？',[['できることを増やす、前向きな積み重ね','grow'],['わくわく・ときめき・楽しい刺激','enjoy'],['がんばった自分をいたわる、やさしい時間','heal'],['頭の中を整理して、見通しをつくること','organize']]],
      ['やりたいことリストから、今ひとつ選ぶなら？',[['あとで役に立ちそうなこと・続けたいこと','grow'],['「ずっと気になっていた！」と思うこと','enjoy'],['無理せずできて、ほっとすること','heal'],['後回しにしていた準備や片づけ','organize']]],
      ['その時間を過ごしたあと、どんな気持ちになれたら最高？',[['明日の自分が少し育った、と感じたい','grow'],['今日が楽しかった！と満たされたい','enjoy'],['心も体も、ふっと軽くなりたい','heal'],['これで次に進める、と安心したい','organize']]]
    ];
    const results={
      grow:{icon:'🌱',title:'育てる気分',lead:'今のあなたは、未来の自分に小さな水やりをしたいとき。完璧じゃなくて大丈夫。続けたいことに、少しだけ触れてみよう。',next:'<h3>次にやることを見つけよう</h3><p>やりたいことリストの <strong>「育てる」</strong> から、<strong>10〜30分で始められること</strong>をひとつ選んでみて。</p>'},
      enjoy:{icon:'🍰',title:'楽しむ気分',lead:'今のあなたは、ときめきに素直になりたいとき。推し活・趣味・おでかけ・気になる体験など、心が弾むことを選んで大丈夫。',next:'<h3>次にやることを見つけよう</h3><p>やりたいことリストの <strong>「楽しむ」</strong> から、今いちばん<strong>「やりたい！」</strong>と思うことをひとつ選んでみて。</p>'},
      heal:{icon:'🌙',title:'癒す気分',lead:'今のあなたは、がんばった自分をやさしく回復させたいとき。まずは余白をつくることが、次の一歩のエネルギーになります。',next:'<h3>次にやることを見つけよう</h3><p>やりたいことリストの <strong>「癒す」</strong> から、今の自分が<strong>いちばんほっとできそうなこと</strong>をひとつ選んでみて。</p>'},
      organize:{icon:'📓',title:'整える気分',lead:'今のあなたは、気持ちや暮らしに見通しをつくりたいとき。小さく整えるだけでも、次の一歩がぐっと見えやすくなります。',next:'<h3>次にやることを見つけよう</h3><p>やりたいことリストの <strong>「整える」</strong> から、終えたあとに<strong>すっきりしそうなこと</strong>をひとつ選んでみて。</p>'}
    };
    let index=0,scores={grow:0,enjoy:0,heal:0,organize:0},current;const $=id=>document.getElementById(id);
    function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
    function showQuestion(){const q=questions[index];$('step').textContent=`QUESTION ${index+1}`;$('number').textContent=`QUESTION ${String(index+1).padStart(2,'0')}`;$('bar').style.width=`${index/questions.length*100}%`;$('question').textContent=q[0];$('choices').innerHTML='';shuffle(q[1]).forEach(([text,type])=>{const b=document.createElement('button');b.className='choice';b.type='button';b.textContent=text;b.onclick=()=>answer(type);$('choices').append(b)})}
    function answer(type){scores[type]++;index++;index<questions.length?showQuestion():showResult()}
    function showResult(){const winner=Object.keys(scores).reduce((a,b)=>scores[b]>scores[a]?b:a,'grow');current=results[winner];$('quiz').style.display='none';$('resultIcon').textContent=current.icon;$('resultTitle').textContent=current.title;$('resultLead').textContent=current.lead;$('next').innerHTML=current.next;$('result').style.display='block'}
    function wrap(ctx,text,x,y,width,lineHeight){let line='',rows=[];for(const c of text){if(ctx.measureText(line+c).width>width){rows.push(line);line=c}else line+=c}rows.push(line);rows.forEach((v,i)=>ctx.fillText(v,x,y+i*lineHeight))}
    function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
    async function image(){const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=1080;c.height=1350;const bg=ctx.createRadialGradient(540,40,30,540,30,950);bg.addColorStop(0,'#367fc3');bg.addColorStop(.48,'#153e7b');bg.addColorStop(1,'#061b43');ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#ffdd7b';ctx.font='30px sans-serif';ctx.textAlign='center';ctx.fillText('✦  ·  ✧  ·  ✦  ·  ✧  ·  ✦',540,80);ctx.font='22px sans-serif';ctx.fillText('NEXT, WHAT DO YOU FEEL LIKE?',540,145);ctx.font='112px sans-serif';ctx.fillText(current.icon,540,285);ctx.fillStyle='#fff8ed';ctx.font='52px serif';ctx.fillText(current.title,540,380);ctx.font='28px sans-serif';wrap(ctx,current.lead,540,465,820,45);ctx.fillStyle='#fff6e6';round(ctx,90,660,900,360,30);ctx.fill();ctx.textAlign='left';ctx.fillStyle='#b76e7e';ctx.font='bold 30px sans-serif';ctx.fillText('次にやることを見つけよう',145,735);ctx.fillStyle='#244064';ctx.font='27px sans-serif';const plain=document.querySelector('#next p').textContent;wrap(ctx,plain,145,800,770,48);ctx.textAlign='center';ctx.fillStyle='#ffe59b';ctx.font='25px sans-serif';ctx.fillText('やりたいことを、今の自分に合う一歩へ。',540,1195);return new Promise(resolve=>c.toBlob(resolve,'image/png'))}
    document.querySelector('.start').onclick=()=>{$('hero').style.display='none';$('quiz').style.display='block';showQuestion()};document.querySelector('.again').onclick=()=>{index=0;scores={grow:0,enjoy:0,heal:0,organize:0};$('result').style.display='none';$('hero').style.display='block'};document.querySelector('.save').onclick=async()=>{const blob=await image(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='今の気分診断.png';a.click();URL.revokeObjectURL(a.href)};
  </script>
</body>
</html>
